<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeewaqar Husnain</title>
<style>
  body { background:#0b0b0d; color:#f2f2f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<script>
  // GitHub Pages has no real server-side routing, so clean URLs like
  // /v/22 (videos page 22) and /i/22 (images page 22) land here as a 404.
  // We detect the intended page from the path and redirect to the real
  // file with ?page= set; index.html / images.html then rewrite the
  // visible URL back to the clean /v/22 or /i/22 form via history.replaceState.
  (function () {
    var path = window.location.pathname;
    var vMatch = path.match(/^\/v\/(\d+)\/?$/);
    var iMatch = path.match(/^\/i\/(\d+)\/?$/);
    if (vMatch) {
      window.location.replace('/index.html?page=' + vMatch[1]);
    } else if (iMatch) {
      window.location.replace('/images.html?page=' + iMatch[1]);
    } else {
      // Unknown path — just send them home.
      window.location.replace('/index.html');
    }
  })();
</script>
<noscript>Page not found. <a href="/index.html">Go to the gallery</a>.</noscript>
</body>
</html>
