<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Timeline — Zeewaqar Husnain</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-elevated: #15151a;
    --text: #f2f2f2;
    --text-dim: #9a9aa3;
    --border: #26262e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 60px;
  }
  .back-link {
    display: inline-block;
    color: #f0c419;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 24px;
  }
  .back-link:hover { color: #fff; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin: 0 0 32px; }
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: linear-gradient(to bottom, #2f8cf0, #a444f0);
  }
  .era-header {
    position: relative;
    margin: 36px 0 14px;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .era-header:first-child { margin-top: 0; }
  .era-header::before {
    content: '';
    position: absolute;
    left: -28px;
    top: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 3px solid var(--bg);
  }
  .era-header.era-3d { color: #2f8cf0; }
  .era-header.era-3d::before { background: #2f8cf0; }
  .era-header.era-ai { color: #a444f0; }
  .era-header.era-ai::before { background: #a444f0; }
  .era-desc { color: var(--text-dim); font-size: 12.5px; font-weight: 400; text-transform: none; display: block; margin-top: 3px; letter-spacing: normal; }
  .month-block {
    position: relative;
    margin-bottom: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .month-block::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 18px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
  }
  .month-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .month-count { color: #f0c419; font-weight: 700; font-size: 12px; }
  .month-highlight {
    font-size: 12.5px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .month-highlight a { color: var(--text-dim); text-decoration: none; }
  .month-highlight a:hover { color: #f0c419; }
  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: var(--text-dim);
    font-size: 12px;
  }
  footer p { margin: 0 0 6px; }
  .footer-link-btn {
    background: none; border: none; color: #f0c419; font-size: 12px;
    cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .footer-link-btn:hover { color: #fff; }
  .footer-dot { margin: 0 8px; color: var(--text-dim); }
  .legal-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 2000; padding: 24px;
  }
  .legal-modal.open { display: flex; }
  .legal-modal-box {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
    max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 28px 28px 24px; position: relative;
  }
  .legal-modal-box h2 { margin: 0 0 14px; font-size: 18px; color: #f0c419; }
  .legal-modal-box p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 12px; }
  .legal-modal-close {
    position: absolute; top: 14px; right: 16px; background: none; border: none;
    color: var(--text-dim); font-size: 22px; cursor: pointer; line-height: 1;
  }
  .legal-modal-close:hover { color: #fff; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="about.html">← Back to About</a>
  <h1>Content timeline</h1>
  <p class="subtitle">How the channel evolved, month by month — from the early 3D illustration archive to the current run of AI-made films and commercials.</p>

  <div class="timeline" id="timeline">Loading…</div>
</div>

<footer>
  <p>&copy; <span id="copyrightYear"></span> Zeewaqar Husnain. All rights reserved.</p>
  <p class="footer-links">
    <button type="button" class="footer-link-btn" id="openPrivacy">Privacy Policy</button>
    <span class="footer-dot">·</span>
    <button type="button" class="footer-link-btn" id="openDisclaimer">Disclaimer</button>
  </p>
</footer>

<div class="legal-modal" id="legalModal">
  <div class="legal-modal-box">
    <button class="legal-modal-close" id="legalModalClose">&times;</button>
    <h2 id="legalModalTitle"></h2>
    <div id="legalModalBody"></div>
  </div>
</div>

<script>
document.getElementById('copyrightYear').textContent = new Date().getFullYear();

const CUTOFF_VIDEO_ID = 'cxPiYux-71U';

function getYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/.*v=|youtu\.be\/)([^&?/]+)/);
  return m ? m[1] : null;
}

fetch('videos-data.json')
  .then(r => r.json())
  .then(videos => {
    const oldestFirst = [...videos].sort((a, b) => new Date(a.date) - new Date(b.date));
    const cutoffIdx = oldestFirst.findIndex(v => getYouTubeId(v.url) === CUTOFF_VIDEO_ID);

    const eras = [
      { key: '3d', label: '3D Illustration Era', desc: 'Hand-built 3D scenes, Ahlul Bayt tributes, and early storytelling experiments.', videos: cutoffIdx === -1 ? [] : oldestFirst.slice(0, cutoffIdx + 1) },
      { key: 'ai', label: 'AI Filmmaking Era', desc: 'AI-generated commercials, cinematic music videos, and dream-world short films.', videos: cutoffIdx === -1 ? oldestFirst : oldestFirst.slice(cutoffIdx + 1) },
    ];

    const timeline = document.getElementById('timeline');
    timeline.innerHTML = eras.map(era => {
      if (!era.videos.length) return '';
      const months = {};
      era.videos.forEach(v => {
        const d = new Date(v.date);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        (months[key] = months[key] || []).push(v);
      });
      const monthKeys = Object.keys(months).sort();
      const monthsHtml = monthKeys.map(mk => {
        const [y, m] = mk.split('-');
        const label = new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        const vids = months[mk];
        const highlight = vids[0];
        return `
          <div class="month-block">
            <div class="month-label">
              <span>${label}</span>
              <span class="month-count">${vids.length} video${vids.length === 1 ? '' : 's'}</span>
            </div>
            <div class="month-highlight">e.g. <a href="${highlight.url}" target="_blank" rel="noopener">${highlight.title}</a></div>
          </div>
        `;
      }).join('');
      return `
        <div class="era-header era-${era.key}">${era.label}<span class="era-desc">${era.desc} — ${era.videos.length.toLocaleString()} videos across ${monthKeys.length} months</span></div>
        ${monthsHtml}
      `;
    }).join('');
  })
  .catch(err => {
    document.getElementById('timeline').innerHTML = '<p>Could not load timeline data.</p>';
    console.error(err);
  });

const LEGAL_CONTENT = {
  privacy: {
    title: 'Privacy Policy',
    body: `
      <p>This site displays videos and images shared by Zeewaqar Husnain. We do not require you to create an account, and we do not collect personal information such as your name, email address, or payment details through this site.</p>
      <p>Standard technical data (such as your browser type, approximate location, and pages visited) may be collected automatically by our hosting provider for the purposes of maintaining and securing the site, as is common with most websites.</p>
      <p>If you click through to YouTube to watch a video, you will be subject to YouTube's own separate privacy policy.</p>
      <p>We do not sell or share any visitor data with third parties for advertising purposes.</p>
    `
  },
  disclaimer: {
    title: 'Disclaimer',
    body: `
      <p>Publish dates and era groupings shown on this page are based on YouTube's own published metadata and may not reflect exact production dates.</p>
      <p>Any action you take based on the content found on this site is strictly at your own risk. We will not be liable for any losses or damages in connection with the use of this site.</p>
      <p>Links to YouTube are provided for convenience. We do not control and are not responsible for the content or practices of that external site.</p>
    `
  }
};
function openLegalModal(key) {
  const content = LEGAL_CONTENT[key];
  if (!content) return;
  document.getElementById('legalModalTitle').textContent = content.title;
  document.getElementById('legalModalBody').innerHTML = content.body;
  document.getElementById('legalModal').classList.add('open');
}
function closeLegalModal() { document.getElementById('legalModal').classList.remove('open'); }
document.getElementById('openPrivacy').addEventListener('click', () => openLegalModal('privacy'));
document.getElementById('openDisclaimer').addEventListener('click', () => openLegalModal('disclaimer'));
document.getElementById('legalModalClose').addEventListener('click', closeLegalModal);
document.getElementById('legalModal').addEventListener('click', (e) => { if (e.target.id === 'legalModal') closeLegalModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLegalModal(); });
</script>

</body>
</html>
