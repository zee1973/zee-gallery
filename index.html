<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zee Waqar — Videos</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-elevated: #15151a;
    --text: #f2f2f2;
    --text-dim: #9a9aa3;
    --accent: #d9b35b;
    --border: #26262e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 48px 24px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  header p { color: var(--text-dim); font-size: 14px; margin: 0 0 16px; }
  .back-link {
    display: inline-block;
    color: var(--accent);
    font-size: 13px;
    text-decoration: none;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .controls button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    max-width: 1400px;
    margin: 40px auto;
    padding: 0 24px;
  }
  .video-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .video-card .embed {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .video-card iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .video-card .meta {
    padding: 14px 16px;
  }
  .video-card .meta h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 500;
  }
  .video-card .meta p {
    margin: 0;
    color: var(--text-dim);
    font-size: 12px;
  }
  .empty-note {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>Videos</h1>
  <p id="countLabel">Loading…</p>
  <a class="back-link" href="images.html">See the images →</a>
  <div class="controls">
    <button id="sortNewest">Newest first</button>
    <button id="sortOldest" class="active">Oldest first</button>
  </div>
</header>

<main class="grid" id="grid"></main>

<footer>Built with Claude</footer>

<script>
let videos = [];
let sortDesc = false;

function getYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/.*v=|youtu\.be\/)([^&?/]+)/);
  return m ? m[1] : null;
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const ordered = [...videos].sort((a, b) => sortDesc ? b.date - a.date : a.date - b.date);
  document.getElementById('countLabel').textContent = ordered.length ? `${ordered.length} videos` : 'No videos added yet';

  if (ordered.length === 0) {
    grid.innerHTML = '<div class="empty-note">No videos added yet. Edit <code>videos-data.json</code> and add your YouTube links to see them here.</div>';
    return;
  }

  ordered.forEach(v => {
    const id = getYouTubeId(v.url);
    const card = document.createElement('div');
    card.className = 'video-card';
    const embed = document.createElement('div');
    embed.className = 'embed';
    if (id) {
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" title="${v.title}" allowfullscreen></iframe>`;
    } else {
      embed.innerHTML = `<a href="${v.url}" target="_blank" style="color:#d9b35b;display:flex;align-items:center;justify-content:center;height:100%;">Watch on YouTube →</a>`;
    }
    card.appendChild(embed);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<h3>${v.title}</h3><p>${new Date(v.date).toLocaleDateString()}</p>`;
    card.appendChild(meta);
    grid.appendChild(card);
  });
}

document.getElementById('sortNewest').addEventListener('click', () => {
  sortDesc = true;
  document.getElementById('sortNewest').classList.add('active');
  document.getElementById('sortOldest').classList.remove('active');
  render();
});
document.getElementById('sortOldest').addEventListener('click', () => {
  sortDesc = false;
  document.getElementById('sortOldest').classList.add('active');
  document.getElementById('sortNewest').classList.remove('active');
  render();
});

fetch('videos-data.json')
  .then(r => r.json())
  .then(json => { videos = json; render(); })
  .catch(() => { videos = []; render(); });
</script>

</body>
</html>
