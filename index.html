<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeewaqar Husnain</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-elevated: #15151a;
    --text: #f2f2f2;
    --text-dim: #9a9aa3;
    --accent: #d9b35b;
    --border: #26262e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 48px 24px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  header p { color: var(--text-dim); font-size: 14px; margin: 0 0 16px; }
  .back-link {
    display: inline-block;
    color: var(--accent);
    font-size: 13px;
    text-decoration: none;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .controls button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  .catBtn.active { background: #3fc966; color: #0b0b0d; border-color: #3fc966; }
  .controls { flex-wrap: wrap; row-gap: 10px; margin-top: 10px; }
  .controls:first-of-type { margin-top: 18px; }
  .group-label {
    color: var(--text-dim);
    font-size: 13px;
    align-self: center;
    width: 34px;
    text-align: right;
    margin-right: 2px;
  }
  .page-jump {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .page-jump input {
    width: 70px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 20px;
    font-size: 13px;
    text-align: center;
  }
  .page-jump input::-webkit-outer-spin-button,
  .page-jump input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .page-jump button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    max-width: 1400px;
    margin: 40px auto;
    padding: 0 24px;
  }
  .video-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .video-card .embed {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .video-card iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .video-card .meta {
    padding: 14px 16px;
  }
  .video-card .meta h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 500;
  }
  .video-card .meta p {
    margin: 0;
    color: var(--text-dim);
    font-size: 12px;
  }
  .empty-note {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
  .pagination {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 900px;
    margin: 0 auto 50px;
    padding: 0 24px;
  }
  .pagination-top { margin: 8px auto 0; }
  .pagination-top:empty { display: none; }
  .pagination button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    min-width: 36px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .pagination button.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 600;
  }
  .pagination button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .pagination .ellipsis {
    color: var(--text-dim);
    padding: 8px 4px;
    font-size: 13px;
  }
  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .link-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
  }
  .link-bar.show { display: flex; }
  .link-bar input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .link-bar button {
    background: var(--accent);
    color: #1a1a1a;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .link-bar .close-btn {
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    padding: 4px 8px;
  }
  .video-card .meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .video-card .meta .meta-text { flex: 1; min-width: 0; cursor: pointer; }
  .share-btn {
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .share-btn:hover { border-color: var(--accent); color: var(--accent); }
  .share-menu {
    position: fixed;
    z-index: 200;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    display: none;
    flex-direction: column;
    min-width: 170px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .share-menu.open { display: flex; }
  .share-menu a, .share-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 6px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .share-menu a:hover, .share-menu button:hover { background: var(--bg); }
</style>
</head>
<body>

<div class="link-bar" id="linkBar">
  <input type="text" id="linkBarInput" readonly>
  <button id="linkBarCopy">Copy</button>
  <button class="close-btn" id="linkBarClose">✕</button>
</div>

<header>
  <h1>Zeewaqar Husnain</h1>
  <p id="countLabel">Loading…</p>
  <a class="back-link" href="images.html">See the images →</a>
  <div class="controls">
    <span class="group-label">All</span>
    <button class="catBtn active" data-cat="all" data-sort="asc">Oldest</button>
    <button class="catBtn" data-cat="all" data-sort="desc">Latest</button>
  </div>
  <nav class="pagination pagination-top" id="paginationTop-all"></nav>

  <div class="controls">
    <span class="group-label">3D</span>
    <button class="catBtn" data-cat="3d" data-sort="asc">Oldest</button>
    <button class="catBtn" data-cat="3d" data-sort="desc">Latest</button>
  </div>
  <nav class="pagination pagination-top" id="paginationTop-3d"></nav>

  <div class="controls">
    <span class="group-label">AI</span>
    <button class="catBtn" data-cat="ai" data-sort="asc">Oldest</button>
    <button class="catBtn" data-cat="ai" data-sort="desc">Latest</button>
  </div>
  <nav class="pagination pagination-top" id="paginationTop-ai"></nav>

  <div class="controls" style="margin-top:10px;">
    <form class="page-jump" id="pageJumpForm">
      <input type="number" id="pageJumpInput" min="1" placeholder="Page #">
      <button type="submit">Go</button>
    </form>
  </div>
</header>

<main class="grid" id="grid"></main>
<nav class="pagination" id="pagination"></nav>

<div class="share-menu" id="shareMenu">
  <a id="shareWhatsapp" target="_blank" rel="noopener">💬 WhatsApp</a>
  <a id="shareTwitter" target="_blank" rel="noopener">𝕏 Twitter / X</a>
  <a id="shareFacebook" target="_blank" rel="noopener">📘 Facebook</a>
  <button id="shareCopy">🔗 Copy link</button>
</div>

<footer>Built with Claude</footer>

<script>
let videos = [];
let sortDesc = false;
let currentPage = 1;
let totalPagesGlobal = 1;
const PAGE_SIZE = 20;

function getYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/.*v=|youtu\.be\/)([^&?/]+)/);
  return m ? m[1] : null;
}

const CUTOFF_VIDEO_ID = 'cxPiYux-71U'; // last 3D video in oldest-first order; everything after is AI
let categoryFilter = 'all'; // 'all' | '3d' | 'ai'

function applyCategoryFilter(list) {
  if (categoryFilter === 'all') return list;
  const oldestFirst = [...list].sort((a, b) => new Date(a.date) - new Date(b.date));
  const cutoffIdx = oldestFirst.findIndex(v => getYouTubeId(v.url) === CUTOFF_VIDEO_ID);
  if (cutoffIdx === -1) return list; // cutoff video not found, don't filter
  const threeD = new Set(oldestFirst.slice(0, cutoffIdx + 1).map(v => v.url));
  return list.filter(v => categoryFilter === '3d' ? threeD.has(v.url) : !threeD.has(v.url));
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const filtered = applyCategoryFilter(videos);
  const ordered = [...filtered].sort((a, b) => sortDesc ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));
  const totalPages = Math.max(1, Math.ceil(ordered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const categoryLabel = categoryFilter === '3d' ? '3D videos' : categoryFilter === 'ai' ? 'AI videos' : 'videos';
  document.getElementById('countLabel').textContent = ordered.length
    ? `${ordered.length} ${categoryLabel} — page ${currentPage} of ${totalPages}`
    : 'No videos found';

  const pageJumpInput = document.getElementById('pageJumpInput');
  if (document.activeElement !== pageJumpInput) {
    pageJumpInput.value = currentPage;
  }
  pageJumpInput.max = totalPages;

  if (ordered.length === 0) {
    grid.innerHTML = '<div class="empty-note">No videos added yet. Edit <code>videos-data.json</code> and add your YouTube links to see them here.</div>';
    renderPagination(0);
    return;
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = ordered.slice(start, start + PAGE_SIZE);

  pageItems.forEach(v => {
    const id = getYouTubeId(v.url);
    const card = document.createElement('div');
    card.className = 'video-card';
    const embed = document.createElement('div');
    embed.className = 'embed';
    if (id) {
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" title="${v.title}" allowfullscreen loading="lazy"></iframe>`;
    } else {
      embed.innerHTML = `<a href="${v.url}" target="_blank" style="color:#d9b35b;display:flex;align-items:center;justify-content:center;height:100%;">Watch on YouTube →</a>`;
    }
    embed.addEventListener('click', () => showLinkBar(v.url), { capture: true });
    card.appendChild(embed);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const metaText = document.createElement('div');
    metaText.className = 'meta-text';
    metaText.innerHTML = `<h3>${v.title}</h3><p>${new Date(v.date).toLocaleDateString()}</p>`;
    metaText.addEventListener('click', () => showLinkBar(v.url));
    meta.appendChild(metaText);
    const shareBtn = document.createElement('button');
    shareBtn.className = 'share-btn';
    shareBtn.textContent = '⤴';
    shareBtn.title = 'Share';
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openShareMenu(shareBtn, v.url, v.title);
    });
    meta.appendChild(shareBtn);
    card.appendChild(meta);
    grid.appendChild(card);
  });

  totalPagesGlobal = totalPages;
  renderPagination(totalPages);
}

function goToPage(p) {
  currentPage = p;
  render();
  updateUrlPage(p);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateUrlPage(p) {
  const url = new URL(window.location.href);
  url.searchParams.delete('page');
  url.pathname = (p > 1) ? '/v/' + p : '/';
  window.history.replaceState({ page: p }, '', url);
}

function renderPaginationInto(nav, totalPages) {
  nav.innerHTML = '';
  if (totalPages <= 1) return;

  const addBtn = (label, page, opts = {}) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    if (opts.active) btn.classList.add('active');
    if (opts.disabled) btn.disabled = true;
    btn.addEventListener('click', () => goToPage(page));
    nav.appendChild(btn);
  };
  const addEllipsis = () => {
    const span = document.createElement('span');
    span.className = 'ellipsis';
    span.textContent = '…';
    nav.appendChild(span);
  };

  addBtn('← Prev', currentPage - 1, { disabled: currentPage === 1 });

  const windowSize = 2;
  const pagesToShow = new Set([1, totalPages]);
  for (let p = currentPage - windowSize; p <= currentPage + windowSize; p++) {
    if (p >= 1 && p <= totalPages) pagesToShow.add(p);
  }
  const sorted = [...pagesToShow].sort((a, b) => a - b);

  let prev = null;
  sorted.forEach(p => {
    if (prev !== null && p - prev > 1) addEllipsis();
    addBtn(String(p), p, { active: p === currentPage });
    prev = p;
  });

  addBtn('Next →', currentPage + 1, { disabled: currentPage === totalPages });
}

function renderPagination(totalPages) {
  ['all', '3d', 'ai'].forEach(cat => {
    const nav = document.getElementById('paginationTop-' + cat);
    if (cat === categoryFilter) {
      renderPaginationInto(nav, totalPages);
    } else {
      nav.innerHTML = '';
    }
  });
  renderPaginationInto(document.getElementById('pagination'), totalPages);
}

function setCatAndSort(cat, newSortDesc) {
  const sameCategory = (cat === categoryFilter);
  const sortChanged = (newSortDesc !== sortDesc);

  if (sameCategory && sortChanged) {
    // Mirror the page within the same filtered set when only sort order flips.
    // Recompute total pages fresh (don't trust a possibly-stale global) so the mirror is always correct.
    const freshTotalPages = Math.max(1, Math.ceil(applyCategoryFilter(videos).length / PAGE_SIZE));
    currentPage = freshTotalPages - currentPage + 1;
  } else if (!sameCategory) {
    currentPage = 1;
  }
  // If neither category nor sort changed (clicking the already-active button), leave page as-is.

  categoryFilter = cat;
  sortDesc = newSortDesc;

  document.querySelectorAll('.catBtn').forEach(btn => {
    const isActive = btn.dataset.cat === cat && btn.dataset.sort === (newSortDesc ? 'desc' : 'asc');
    btn.classList.toggle('active', isActive);
  });

  render();
  updateUrlPage(currentPage);
}

document.querySelectorAll('.catBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    setCatAndSort(btn.dataset.cat, btn.dataset.sort === 'desc');
  });
});

function openShareMenu(anchorEl, url, title) {
  const menu = document.getElementById('shareMenu');
  const rect = anchorEl.getBoundingClientRect();
  menu.style.top = (rect.bottom + 6) + 'px';
  menu.style.left = Math.max(8, rect.right - 180) + 'px';
  menu.classList.add('open');

  const text = encodeURIComponent(title || '');
  const link = encodeURIComponent(url);
  document.getElementById('shareWhatsapp').href = `https://wa.me/?text=${text}%20${link}`;
  document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?text=${text}&url=${link}`;
  document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${link}`;
  document.getElementById('shareCopy').onclick = () => {
    navigator.clipboard?.writeText(url).catch(() => {});
    const btn = document.getElementById('shareCopy');
    const original = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  };

  const closeOnOutside = (ev) => {
    if (!menu.contains(ev.target)) {
      menu.classList.remove('open');
      document.removeEventListener('click', closeOnOutside);
    }
  };
  setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
}

function showLinkBar(url) {
  const bar = document.getElementById('linkBar');
  const input = document.getElementById('linkBarInput');
  input.value = url;
  bar.classList.add('show');
  input.focus();
  input.select();
}

document.getElementById('linkBarCopy').addEventListener('click', () => {
  const input = document.getElementById('linkBarInput');
  input.select();
  navigator.clipboard?.writeText(input.value).catch(() => {});
  document.execCommand && document.execCommand('copy');
  const btn = document.getElementById('linkBarCopy');
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = original; }, 1200);
});

document.getElementById('linkBarClose').addEventListener('click', () => {
  document.getElementById('linkBar').classList.remove('show');
});

document.getElementById('pageJumpForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('pageJumpInput');
  let p = parseInt(input.value, 10);
  if (!p || isNaN(p)) return;
  p = Math.min(Math.max(p, 1), totalPagesGlobal);
  goToPage(p);
  input.blur();
});

document.getElementById('pageJumpInput').addEventListener('focus', (e) => {
  e.target.value = '';
});
document.getElementById('pageJumpInput').addEventListener('blur', (e) => {
  if (e.target.value === '') e.target.value = currentPage;
});

function readPageFromUrl() {
  const url = new URL(window.location.href);
  // Support the clean path form (/v/22) and the old query form (?page=22)
  const pathMatch = url.pathname.match(/^\/v\/(\d+)\/?$/);
  const p = pathMatch ? parseInt(pathMatch[1], 10) : parseInt(url.searchParams.get('page'), 10);
  return (p && p > 0) ? p : 1;
}

window.addEventListener('popstate', () => {
  currentPage = readPageFromUrl();
  render();
});

fetch('videos-data.json')
  .then(r => r.json())
  .then(json => {
    videos = json;
    currentPage = readPageFromUrl();
    render();
  })
  .catch(() => { videos = []; render(); });
</script>

</body>
</html>
