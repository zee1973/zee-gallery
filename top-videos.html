<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan Favorites — Zeewaqar Husnain</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-elevated: #15151a;
    --text: #f2f2f2;
    --text-dim: #9a9aa3;
    --border: #26262e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 60px;
  }
  .back-link {
    display: inline-block;
    color: #f0c419;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 24px;
  }
  .back-link:hover { color: #fff; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin: 0 0 32px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, transform 0.15s;
  }
  .row:hover { border-color: #ef1c24; transform: translateX(2px); }
  .rank {
    flex: 0 0 34px;
    font-size: 18px;
    font-weight: 800;
    color: #f0c419;
    text-align: center;
  }
  .row:nth-child(1) .rank { color: #ffd84d; font-size: 22px; }
  .row:nth-child(2) .rank { color: #d7d7df; }
  .row:nth-child(3) .rank { color: #d99a5b; }
  .thumb {
    flex: 0 0 120px;
    width: 120px;
    height: 68px;
    border-radius: 8px;
    object-fit: cover;
    background: #000;
  }
  .meta { flex: 1 1 auto; min-width: 0; }
  .title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub-meta { font-size: 12px; color: var(--text-dim); }
  .views {
    flex: 0 0 auto;
    text-align: right;
    font-size: 13px;
  }
  .views .num { font-weight: 700; color: #ef1c24; display: block; }
  .views .lbl { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; }
  @media (max-width: 600px) {
    .wrap { padding: 32px 14px 40px; }
    .row { padding: 10px 10px; gap: 10px; }
    .rank { flex-basis: 20px; font-size: 14px; }
    .row:nth-child(1) .rank { font-size: 16px; }
    .thumb { flex-basis: 72px; width: 72px; height: 41px; }
    .title { font-size: 12.5px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sub-meta { font-size: 10.5px; }
    .views { font-size: 11px; }
    .views .num { font-size: 12px; }
  }
  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: var(--text-dim);
    font-size: 12px;
  }
  footer p { margin: 0 0 6px; }
  .footer-link-btn {
    background: none; border: none; color: #f0c419; font-size: 12px;
    cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .footer-link-btn:hover { color: #fff; }
  .footer-dot { margin: 0 8px; color: var(--text-dim); }
  .legal-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 2000; padding: 24px;
  }
  .legal-modal.open { display: flex; }
  .legal-modal-box {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
    max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 28px 28px 24px; position: relative;
  }
  .legal-modal-box h2 { margin: 0 0 14px; font-size: 18px; color: #f0c419; }
  .legal-modal-box p { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 12px; }
  .legal-modal-close {
    position: absolute; top: 14px; right: 16px; background: none; border: none;
    color: var(--text-dim); font-size: 22px; cursor: pointer; line-height: 1;
  }
  .legal-modal-close:hover { color: #fff; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="about.html">← Back to About</a>
  <h1>Fan favorites</h1>
  <p class="subtitle">The most-watched videos on the channel, ranked by total views.</p>

  <div class="list" id="videoList"></div>
</div>

<footer>
  <p>&copy; <span id="copyrightYear"></span> Zeewaqar Husnain. All rights reserved.</p>
  <p class="footer-links">
    <button type="button" class="footer-link-btn" id="openPrivacy">Privacy Policy</button>
    <span class="footer-dot">·</span>
    <button type="button" class="footer-link-btn" id="openDisclaimer">Disclaimer</button>
  </p>
</footer>

<div class="legal-modal" id="legalModal">
  <div class="legal-modal-box">
    <button class="legal-modal-close" id="legalModalClose">&times;</button>
    <h2 id="legalModalTitle"></h2>
    <div id="legalModalBody"></div>
  </div>
</div>

<script>
document.getElementById('copyrightYear').textContent = new Date().getFullYear();

fetch('top-videos-data.json')
  .then(r => r.json())
  .then(data => {
    const videos = Array.isArray(data) ? data : data.videos;
    const list = document.getElementById('videoList');
    list.innerHTML = videos.map((v, i) => {
      const date = new Date(v.publishedAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
      return `
        <a class="row" href="https://www.youtube.com/watch?v=${v.videoId}" target="_blank" rel="noopener">
          <span class="rank">${i + 1}</span>
          <img class="thumb" src="https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg" loading="lazy" alt="">
          <span class="meta">
            <p class="title">${v.title}</p>
            <span class="sub-meta">${date} · ${v.likeCount.toLocaleString()} likes · ${v.commentCount.toLocaleString()} comments</span>
          </span>
          <span class="views">
            <span class="num">${v.viewCount.toLocaleString()}</span>
            <span class="lbl">views</span>
          </span>
        </a>
      `;
    }).join('');
  })
  .catch(err => {
    document.getElementById('videoList').innerHTML = '<p>Could not load video data.</p>';
    console.error(err);
  });

const LEGAL_CONTENT = {
  privacy: {
    title: 'Privacy Policy',
    body: `
      <p>This site displays videos and images shared by Zeewaqar Husnain. We do not require you to create an account, and we do not collect personal information such as your name, email address, or payment details through this site.</p>
      <p>Standard technical data (such as your browser type, approximate location, and pages visited) may be collected automatically by our hosting provider for the purposes of maintaining and securing the site, as is common with most websites.</p>
      <p>If you click through to YouTube to watch a video, you will be subject to YouTube's own separate privacy policy.</p>
      <p>We do not sell or share any visitor data with third parties for advertising purposes.</p>
    `
  },
  disclaimer: {
    title: 'Disclaimer',
    body: `
      <p>View counts, likes, and comment counts shown on this page are pulled from YouTube analytics tools at the time of the last update and may not reflect real-time figures on YouTube itself.</p>
      <p>Any action you take based on the content found on this site is strictly at your own risk. We will not be liable for any losses or damages in connection with the use of this site.</p>
      <p>Links to YouTube are provided for convenience. We do not control and are not responsible for the content or practices of that external site.</p>
    `
  }
};
function openLegalModal(key) {
  const content = LEGAL_CONTENT[key];
  if (!content) return;
  document.getElementById('legalModalTitle').textContent = content.title;
  document.getElementById('legalModalBody').innerHTML = content.body;
  document.getElementById('legalModal').classList.add('open');
}
function closeLegalModal() { document.getElementById('legalModal').classList.remove('open'); }
document.getElementById('openPrivacy').addEventListener('click', () => openLegalModal('privacy'));
document.getElementById('openDisclaimer').addEventListener('click', () => openLegalModal('disclaimer'));
document.getElementById('legalModalClose').addEventListener('click', closeLegalModal);
document.getElementById('legalModal').addEventListener('click', (e) => { if (e.target.id === 'legalModal') closeLegalModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLegalModal(); });
</script>

</body>
</html>
