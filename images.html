<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeewaqar Husnain</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-elevated: #15151a;
    --text: #f2f2f2;
    --text-dim: #9a9aa3;
    --accent: #d9b35b;
    --border: #26262e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 48px 24px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: 0.3px;
  }
  header p {
    color: var(--text-dim);
    margin: 0 0 20px;
    font-size: 14px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .controls button:hover {
    border-color: var(--accent);
  }
  .controls button.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
  }
  .page-jump {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .page-jump input {
    width: 70px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 20px;
    font-size: 13px;
    text-align: center;
  }
  .page-jump input::-webkit-outer-spin-button,
  .page-jump input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .page-jump button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .videos-link {
    display: inline-block;
    margin-top: 14px;
    color: var(--accent);
    font-size: 13px;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .videos-link:hover { border-bottom-color: var(--accent); }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 4px;
    padding: 4px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .item {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    background: var(--bg-elevated);
    cursor: pointer;
  }
  .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .item:hover img {
    transform: scale(1.05);
  }
  .item .overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 10px 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    font-size: 11px;
    color: #ddd;
    opacity: 0;
    transition: opacity 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item:hover .overlay { opacity: 1; }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 86vh;
    object-fit: contain;
    border-radius: 4px;
  }
  .lightbox .close {
    position: absolute;
    top: 20px;
    right: 28px;
    font-size: 32px;
    color: #fff;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
  }
  .lightbox .caption {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ccc;
    font-size: 13px;
    padding: 0 40px;
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    font-size: 28px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
  }
  .lightbox .nav:hover { background: rgba(255,255,255,0.18); }
  .lightbox .prev { left: 16px; }
  .lightbox .next { right: 16px; }

  .pagination {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 900px;
    margin: 24px auto 40px;
    padding: 0 24px;
  }
  .pagination button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    min-width: 36px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .pagination button.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 600;
  }
  .pagination button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .pagination .ellipsis {
    color: var(--text-dim);
    padding: 8px 4px;
    font-size: 13px;
  }

  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .share-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 2;
  }
  .item:hover .share-btn { opacity: 1; }
  .lightbox .share-btn {
    position: absolute;
    top: 20px;
    right: 80px;
    opacity: 1;
    background: rgba(255,255,255,0.08);
  }
  .share-menu {
    position: fixed;
    z-index: 1100;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    display: none;
    flex-direction: column;
    min-width: 170px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .share-menu.open { display: flex; }
  .share-menu a, .share-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 6px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .share-menu a:hover, .share-menu button:hover { background: var(--bg); }
</style>
</head>
<body>

<header>
  <h1>Zeewaqar Husnain</h1>
  <p id="countLabel">Loading…</p>
  <div class="controls">
    <button id="sortNewest" class="active">Newest first</button>
    <button id="sortOldest">Oldest first</button>
    <form class="page-jump" id="pageJumpForm">
      <input type="number" id="pageJumpInput" min="1" placeholder="Page #">
      <button type="submit">Go</button>
    </form>
  </div>
  <div>
    <a class="videos-link" href="index.html">← Back to videos</a>
  </div>
</header>

<main class="gallery" id="gallery"></main>
<nav class="pagination" id="pagination"></nav>

<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose">&times;</button>
  <button class="nav prev" id="lbPrev">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <button class="nav next" id="lbNext">&#8250;</button>
  <button class="share-btn" id="lbShare" title="Share">⤴</button>
  <div class="caption" id="lbCaption"></div>
</div>

<div class="share-menu" id="shareMenu">
  <a id="shareWhatsapp" target="_blank" rel="noopener">💬 WhatsApp</a>
  <a id="shareTwitter" target="_blank" rel="noopener">𝕏 Twitter / X</a>
  <a id="shareFacebook" target="_blank" rel="noopener">📘 Facebook</a>
  <button id="shareCopy">🔗 Copy link</button>
</div>

<footer>Built with Claude · images hosted directly on this page</footer>

<script>
let data = [];
let currentOrder = [];
let sortDesc = true; // newest first by default
let currentIndex = 0;
let currentPage = 1;
let totalPagesGlobal = 1;
const PAGE_SIZE = 40;

function absoluteImageUrl(file) {
  return new URL('images/' + file, window.location.href).href;
}

function openShareMenu(anchorEl, url, title) {
  const menu = document.getElementById('shareMenu');
  const rect = anchorEl.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.right - 180;
  if (rect.bottom > window.innerHeight - 160) top = rect.top - 190;
  menu.style.top = Math.max(8, top) + 'px';
  menu.style.left = Math.max(8, left) + 'px';
  menu.classList.add('open');

  const text = encodeURIComponent(title || '');
  const link = encodeURIComponent(url);
  document.getElementById('shareWhatsapp').href = `https://wa.me/?text=${text}%20${link}`;
  document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?text=${text}&url=${link}`;
  document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${link}`;
  document.getElementById('shareCopy').onclick = () => {
    navigator.clipboard?.writeText(url).catch(() => {});
    const btn = document.getElementById('shareCopy');
    const original = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  };

  const closeOnOutside = (ev) => {
    if (!menu.contains(ev.target)) {
      menu.classList.remove('open');
      document.removeEventListener('click', closeOnOutside);
    }
  };
  setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
}

function cleanTitle(title) {
  // Strip "zeewaqar_" prefix and Midjourney-style job params / uuid tails for readability
  let t = title.replace(/^zeewaqar_/, '');
  t = t.replace(/_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}.*$/i, '');
  t = t.replace(/--[a-z]+ [^\s_]+/gi, '');
  t = t.replace(/_/g, ' ').trim();
  if (t.length > 70) t = t.slice(0, 70) + '…';
  return t || title;
}

function render() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  currentOrder = [...data].sort((a, b) => sortDesc ? b.mtime - a.mtime : a.mtime - b.mtime);

  const totalPages = Math.max(1, Math.ceil(currentOrder.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  document.getElementById('countLabel').textContent = currentOrder.length
    ? `${currentOrder.length} pieces — page ${currentPage} of ${totalPages}`
    : 'No images yet';

  totalPagesGlobal = totalPages;
  const pageJumpInput = document.getElementById('pageJumpInput');
  if (document.activeElement !== pageJumpInput) {
    pageJumpInput.value = currentPage;
  }
  pageJumpInput.max = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = currentOrder.slice(start, start + PAGE_SIZE);

  pageItems.forEach((item, pageIdx) => {
    const idx = start + pageIdx; // index into the full sorted set, for the lightbox
    const div = document.createElement('div');
    div.className = 'item';
    const img = document.createElement('img');
    img.src = 'images/' + item.file;
    img.loading = 'lazy';
    img.alt = cleanTitle(item.title);
    div.appendChild(img);

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.textContent = cleanTitle(item.title);
    div.appendChild(overlay);

    const shareBtn = document.createElement('button');
    shareBtn.className = 'share-btn';
    shareBtn.textContent = '⤴';
    shareBtn.title = 'Share';
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openShareMenu(shareBtn, absoluteImageUrl(item.file), cleanTitle(item.title));
    });
    div.appendChild(shareBtn);

    div.addEventListener('click', () => openLightbox(idx));
    gallery.appendChild(div);
  });

  renderPagination(totalPages);
}

function goToPage(p) {
  currentPage = p;
  render();
  updateUrlPage(p);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateUrlPage(p) {
  const url = new URL(window.location.href);
  url.searchParams.delete('page');
  url.pathname = (p > 1) ? '/i/' + p : '/images.html';
  window.history.replaceState({ page: p }, '', url);
}

function renderPagination(totalPages) {
  const nav = document.getElementById('pagination');
  nav.innerHTML = '';
  if (totalPages <= 1) return;

  const addBtn = (label, page, opts = {}) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    if (opts.active) btn.classList.add('active');
    if (opts.disabled) btn.disabled = true;
    btn.addEventListener('click', () => goToPage(page));
    nav.appendChild(btn);
  };
  const addEllipsis = () => {
    const span = document.createElement('span');
    span.className = 'ellipsis';
    span.textContent = '…';
    nav.appendChild(span);
  };

  addBtn('← Prev', currentPage - 1, { disabled: currentPage === 1 });

  const windowSize = 2;
  const pagesToShow = new Set([1, totalPages]);
  for (let p = currentPage - windowSize; p <= currentPage + windowSize; p++) {
    if (p >= 1 && p <= totalPages) pagesToShow.add(p);
  }
  const sorted = [...pagesToShow].sort((a, b) => a - b);

  let prev = null;
  sorted.forEach(p => {
    if (prev !== null && p - prev > 1) addEllipsis();
    addBtn(String(p), p, { active: p === currentPage });
    prev = p;
  });

  addBtn('Next →', currentPage + 1, { disabled: currentPage === totalPages });
}

function openLightbox(idx) {
  currentIndex = idx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function updateLightbox() {
  const item = currentOrder[currentIndex];
  document.getElementById('lbImg').src = 'images/' + item.file;
  document.getElementById('lbCaption').textContent = cleanTitle(item.title);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.getElementById('lbShare').addEventListener('click', (e) => {
  e.stopPropagation();
  const item = currentOrder[currentIndex];
  openShareMenu(e.currentTarget, absoluteImageUrl(item.file), cleanTitle(item.title));
});
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.getElementById('lbPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentOrder.length) % currentOrder.length;
  updateLightbox();
});
document.getElementById('lbNext').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentOrder.length;
  updateLightbox();
});
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
});

document.getElementById('sortNewest').addEventListener('click', () => {
  sortDesc = true;
  currentPage = 1;
  document.getElementById('sortNewest').classList.add('active');
  document.getElementById('sortOldest').classList.remove('active');
  render();
  updateUrlPage(1);
});
document.getElementById('sortOldest').addEventListener('click', () => {
  sortDesc = false;
  currentPage = 1;
  document.getElementById('sortOldest').classList.add('active');
  document.getElementById('sortNewest').classList.remove('active');
  render();
  updateUrlPage(1);
});

document.getElementById('pageJumpForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('pageJumpInput');
  let p = parseInt(input.value, 10);
  if (!p || isNaN(p)) return;
  p = Math.min(Math.max(p, 1), totalPagesGlobal);
  goToPage(p);
  input.blur();
});

document.getElementById('pageJumpInput').addEventListener('focus', (e) => {
  e.target.value = '';
});
document.getElementById('pageJumpInput').addEventListener('blur', (e) => {
  if (e.target.value === '') e.target.value = currentPage;
});

function readPageFromUrl() {
  const url = new URL(window.location.href);
  // Support the clean path form (/i/22) and the old query form (?page=22)
  const pathMatch = url.pathname.match(/^\/i\/(\d+)\/?$/);
  const p = pathMatch ? parseInt(pathMatch[1], 10) : parseInt(url.searchParams.get('page'), 10);
  return (p && p > 0) ? p : 1;
}

window.addEventListener('popstate', () => {
  currentPage = readPageFromUrl();
  render();
});

fetch('gallery-data.json')
  .then(r => r.json())
  .then(json => {
    data = json;
    currentPage = readPageFromUrl();
    render();
  })
  .catch(err => {
    document.getElementById('countLabel').textContent = 'Failed to load gallery data.';
    console.error(err);
  });
</script>

</body>
</html>
